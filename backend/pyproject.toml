[project]
name = "arch-nemesis-reload-backend"
version = "0.1.0"
description = "Backend for Arch Nemesis: Reload"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arch_nemesis = ["prompts/**/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
